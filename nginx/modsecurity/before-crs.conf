SecAction \
  "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH PUT DELETE'"

# Allow the base64 avatar (data:image/...;base64,...) in PATCH /users/me.
# Base64 is random-looking text: depending on the image it matches SQLi
# (942120 "==", 942200, 942340, 942450), LFI (930120 "/sys/"), RCE (932235,
# 932236, 932260), XSS (941130, 941170) or PHP/SSRF (934170) patterns.
# Instead of disabling those rules, only the ARGS:json.avatar field is
# removed from the attack categories below, and only for this endpoint and
# method: the rest of the request (e.g. "username") and every other route
# are still fully inspected. The backend then rejects any avatar that is not
# a PNG/JPEG/WebP/GIF data URL made of base64 characters only.
SecRule REQUEST_METHOD "@streq PATCH" \
  "id:1000001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  chain"
  SecRule REQUEST_URI "@streq /users/me" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-generic;ARGS:json.avatar"

# Monitoring queries: PromQL is not SQL or shell, but expressions such as
# "sum(rate(http_requests_total[1m])) by (route)" match SQLi (942150,
# 942200, 942410, 942430) and command-injection (932240) patterns, and
# Grafana legend templates such as "{{route}}" match the AngularJS template
# injection rule (941380). Every dashboard panel using "by (...)" showed
# "No data" because Grafana's request was blocked with a 403.
# Only the query fields are excluded, only on the two read-only query
# endpoints (Grafana's also requires a login); everything else in those
# requests, and every other route, is still inspected.
SecRule REQUEST_URI "@beginsWith /grafana/api/ds/query" \
  "id:1000002,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_0.expr,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_0.expr,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_0.expr,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_0.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_0.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_0.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_1.expr,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_1.expr,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_1.expr,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_1.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_1.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_1.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_2.expr,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_2.expr,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_2.expr,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_2.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_2.legendFormat,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.queries.array_2.legendFormat"

SecRule REQUEST_URI "@beginsWith /prometheus/api/v1/" \
  "id:1000003,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:query,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:query,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:query,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:match[],\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:match[],\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:match[]"
