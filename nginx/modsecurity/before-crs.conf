SecAction \
  "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH PUT DELETE'"

# Allow the base64 avatar (data:image/...;base64,...) in PATCH /users/me.
# Base64 is random-looking text: depending on the image it matches SQLi
# (942120 "==", 942200, 942340, 942450), LFI (930120 "/sys/"), RCE (932235,
# 932236, 932260), XSS (941130, 941170) or PHP/SSRF (934170) patterns.
# Instead of disabling those rules, only the ARGS:json.avatar field is
# removed from the attack categories below, and only for this endpoint and
# method: the rest of the request (e.g. "username") and every other route
# are still fully inspected. The backend then rejects any avatar that is not
# a PNG/JPEG/WebP/GIF data URL made of base64 characters only.
SecRule REQUEST_METHOD "@streq PATCH" \
  "id:1000001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  chain"
  SecRule REQUEST_URI "@streq /users/me" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-generic;ARGS:json.avatar"
