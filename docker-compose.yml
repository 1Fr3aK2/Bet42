services:
  backend_migrate:
    container_name: backend_migrate
    build:
      context: ./backend
    networks:
      - transcendence
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: on-failure

  backend_seed:
    container_name: backend_seed
    build:
      context: ./backend
    networks:
      - transcendence
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
      NODE_EXTRA_CA_CERTS: ${VAULT_CACERT}
    volumes:
      - ./vault/certs:/etc/vault/certs:ro
      - vault-approle:/vault/approle:ro
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      vault_init:
        condition: service_completed_successfully
    command: ["npx", "prisma", "db", "seed"]
    restart: on-failure

  backend:
    container_name: backend
    build:
      context: ./backend
    networks:
      - transcendence
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
      NODE_EXTRA_CA_CERTS: ${VAULT_CACERT}
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
    volumes:
      - ./vault/certs:/etc/vault/certs:ro
      - vault-approle:/vault/approle:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      backend_migrate:
        condition: service_completed_successfully
      backend_seed:
        condition: service_completed_successfully
      vault_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    networks:
      - transcendence
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  modsec-audit-init:
    image: alpine
    command:
      - sh
      - -c
      - touch /var/log/modsecurity/audit.log && chown -R 101:101 /var/log/modsecurity
    volumes:
      - modsec-audit-log:/var/log/modsecurity

  nginx:
    container_name: nginx
    image: owasp/modsecurity-crs:4-nginx-202606261106
    networks:
      - transcendence
    ports:
      - "443:8443"
      - "80:8080"
    volumes:
      - ./nginx/template/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template
      - ./scripts/setup-certs.sh:/scripts/setup-certs.sh
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/modsecurity/before-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
      - ./nginx/modsecurity/exclusions.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
      - modsec-audit-log:/var/log/modsecurity
      - ./nginx/status:/usr/share/nginx/status:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      modsec-audit-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stub_status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      BACKEND: ${BACKEND}
      SSL_CERT_FILE: /etc/nginx/certs/nginx.cert
      SSL_CERT_KEY_FILE: /etc/nginx/certs/nginx.key
      SSL_PORT: 8443
      PORT: 8080
      SERVER_NAME: Transcendence
      SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      PARANOIA: "2"
      BLOCKING_PARANOIA: "2"
      MODSEC_AUDIT_LOG_PARTS: "AIJDEFHZ"
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
    restart: unless-stopped

  nginx_exporter:
    container_name: nginx_exporter
    image: nginx/nginx-prometheus-exporter
    networks:
      - transcendence
    command:
      - "-nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  vault-data-init:
    image: alpine
    command: ["chown", "-R", "100:1000", "/vault/data"]
    volumes:
      - vault-data:/vault/data

  vault:
    container_name: vault
    image: hashicorp/vault
    networks:
      - transcendence
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
    volumes:
      - ./vault/config:/etc/vault/config:ro
      - ./vault/certs:/etc/vault/certs:ro
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD-SHELL", "vault status; [ $? -ne 1 ]"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: vault server -config=/etc/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    depends_on:
      vault-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  vault-keys-init:
    image: alpine
    command: ["chown", "-R", "100:1000", "/vault/keys"]
    volumes:
      - vault-keys:/vault/keys

  vault-approle-init:
    image: alpine
    command: ["chown", "-R", "100:1000", "/vault/approle"]
    volumes:
      - vault-approle:/vault/approle

  vault_init:
    container_name: vault_init
    image: hashicorp/vault
    networks:
      - transcendence
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    entrypoint: ["sh", "/etc/vault/config/vault-init.sh"]
    volumes:
      - ./vault/config:/etc/vault/config:ro
      - ./vault/certs:/etc/vault/certs:ro
      - vault-keys:/vault/keys
      - vault-approle:/vault/approle
    depends_on:
      vault:
        condition: service_healthy
      vault-keys-init:
        condition: service_completed_successfully
      vault-approle-init:
        condition: service_completed_successfully
    restart: on-failure:3

  grafana:
    container_name: grafana
    image: grafana/grafana
    networks:
      - transcendence
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-db:/var/lib/grafana/
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  prometheus-init:
    image: alpine
    command: ["chown", "-R", "65534:65534", "/var/lib/prometheus/data"]
    volumes:
      - prometheus-data:/var/lib/prometheus/data

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    networks:
      - transcendence
    volumes:
      - prometheus-data:/var/lib/prometheus/data
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/var/lib/prometheus/data"
      - "--web.external-url=https://localhost/prometheus/"
      - "--web.route-prefix=/prometheus/"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - transcendence
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis_exporter:
    container_name: redis_exporter
    image: oliver006/redis_exporter
    networks:
      - transcendence
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:16
    networks:
      - transcendence
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres_backup:
    container_name: postgres_backup
    image: postgres:16
    networks:
      - transcendence
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups/postgres
      RETENTION_DAYS: 7
    volumes:
      - ./backups/postgres:/backups/postgres
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "while true; do
        /usr/local/bin/backup-postgres.sh;
        sleep 86400;
      done"
    restart: unless-stopped

  postgres_exporter:
    container_name: postgres_exporter
    image: prometheuscommunity/postgres-exporter
    networks:
      - transcendence
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch_backups_init:
    image: alpine
    command: ["chown", "-R", "1000:0", "/usr/share/elasticsearch/backups"]
    volumes:
      - ./backups/elasticsearch:/usr/share/elasticsearch/backups

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.18
    networks:
      - transcendence
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: /usr/share/elasticsearch/backups
    mem_limit: 1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./backups/elasticsearch:/usr/share/elasticsearch/backups
    depends_on:
      elasticsearch_backups_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.19.18
    networks:
      - transcendence
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
    mem_limit: 512m
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped


  kibana_user_init:
    container_name: kibana_user_init
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.18
    networks:
      - transcendence
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
      KIBANA_PASSWORD: "${KIBANA_PASSWORD}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -sf -X POST -u "elastic:$$ELASTIC_PASSWORD" \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$$KIBANA_PASSWORD\"}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure

  elasticsearch_ilm_init:
    container_name: elasticsearch_ilm_init
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.18
    networks:
      - transcendence
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD}"
    entrypoint: ["/bin/sh"]
    command: ["/scripts/ilm-init.sh"]
    volumes:
      - ./logging/elasticsearch/ilm-init.sh:/scripts/ilm-init.sh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.19.18
    networks:
      - transcendence
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "${KIBANA_PASSWORD}"
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana_user_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/kibana/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  filebeat:
    container_name: filebeat
    build:
      context: ./logging/filebeat
    user: root
    networks:
      - transcendence
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - modsec-audit-log:/var/log/modsecurity:ro
    depends_on:
      logstash:
        condition: service_started
      modsec-audit-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  grafana-db:
  prometheus-data:
  redis-data:
  postgres-data:
  vault-data:
  vault-keys:
  vault-approle:
  elasticsearch-data:
  modsec-audit-log:

networks:
  transcendence:
    driver: bridge