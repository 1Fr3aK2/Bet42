server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Files built by Vite have a hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths (/leaderboard, /privacy, ...) load
    # index.html and React Router shows the right page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
