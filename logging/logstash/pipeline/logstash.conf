input {
  beats {
    port => 5044
  }
}

filter {
  if [log_type] == "modsec_audit" {

    json {
      source => "message"
      target => "modsec"
    }

    mutate {
      add_field => {
        "source_ip" => "%{[modsec][transaction][client_ip]}"
        "http_method" => "%{[modsec][transaction][request][method]}"
        "uri" => "%{[modsec][transaction][request][uri]}"
        "http_code" => "%{[modsec][transaction][response][http_code]}"
      }
    }

    mutate {
      convert => {
        "http_code" => "integer"
      }
    }

    if [modsec][transaction][messages] {
      ruby {
        code => '
          messages = event.get("[modsec][transaction][messages]")

          if messages && !messages.empty?
            rule_ids = []

            messages.each do |msg|
              details = msg["details"] || {}
              rule_id = details["ruleId"]

              if rule_id
                rule_ids << rule_id unless rule_ids.include?(rule_id)
              end

              if rule_id == "949110" || rule_id == "959100"
                match = msg["message"].match(/Total Score: (\d+)/i)
                if match
                  event.set("anomaly_score", match[1].to_i)
                  event.set("anomaly_direction", rule_id == "949110" ? "inbound" : "outbound")
                end
              elsif !event.get("rule_id") && rule_id
                event.set("rule_id", rule_id)
                event.set("rule_message", msg["message"])
                event.set("rule_severity", details["severity"])
              end
            end

            event.set("rule_ids", rule_ids) unless rule_ids.empty?
          end
        '
      }
    }

    date {
      match => [
        "[modsec][transaction][time_stamp]",
        "EEE MMM d HH:mm:ss yyyy",
        "ISO8601"
      ]
      target => "@timestamp"
    }

    mutate {
      remove_field => ["message"]
    }
  }
}

output {
  if [log_type] == "modsec_audit" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "waf-audit-%{+YYYY.MM.dd}"
      user => "logstash_writer"
      password => "${ELASTIC_PASSWORD}"
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "transcendence-logs-%{+YYYY.MM.dd}"
      user => "logstash_writer"
      password => "${ELASTIC_PASSWORD}"
      manage_template => false
    }
  }
}